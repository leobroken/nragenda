<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar NRAgenda - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex bg-indigo-600 text-white p-3 rounded-2xl shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-scissors text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">NRAgenda</h1>
            <p class="text-xs text-slate-400">Entre para gerenciar o seu salão ou barbearia</p>
        </div>

        <form id="loginForm" class="space-y-4" onsubmit="handleLogin(event)">
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">E-mail de Acesso</label>
                <input type="email" id="email" required placeholder="seu@email.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition text-sm">
                Acessar Painel
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300 transition"><i class="fa-solid fa-arrow-left mr-1"></i> Voltar para a página inicial</a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
