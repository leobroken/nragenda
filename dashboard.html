<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - NRAgenda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex h-screen overflow-hidden">

    <!-- Sidebar Lateral -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div class="p-6 space-y-8">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl font-bold shadow-lg shadow-indigo-600/30">
                    <i class="fa-solid fa-scissors"></i>
                </div>
                <span class="text-xl font-extrabold text-white tracking-tight">NR<span class="text-indigo-500">Agenda</span></span>
            </div>
            <nav class="space-y-1.5 text-sm font-medium">
                <button onclick="switchTab('agenda')" id="btn-agenda" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-indigo-600 text-white font-semibold transition shadow-md shadow-indigo-600/20">
                    <i class="fa-solid fa-calendar-days w-5"></i>
                    <span>Agenda</span>
                </button>
                <button onclick="switchTab('clientes')" id="btn-clientes" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-users w-5"></i>
                    <span>Clientes</span>
                </button>
                <button onclick="switchTab('produtos')" id="btn-produtos" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-box-archive w-5"></i>
                    <span>Produtos & Estoque</span>
                </button>
                <button onclick="switchTab('relatorios')" id="btn-relatorios" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chart-line w-5"></i>
                    <span>Relatórios Mensais</span>
                </button>
            </nav>
        </div>
        <div class="p-6 border-t border-slate-800">
            <a href="index.html" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-red-400 hover:bg-red-500/10 transition text-sm font-medium">
                <i class="fa-solid fa-right-from-bracket w-5"></i>
                <span>Sair do Sistema</span>
            </a>
        </div>
    </aside>

    <!-- Área Principal -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="h-20 bg-white border-b border-slate-100 px-8 flex items-center justify-between sticky top-0 z-20">
            <h2 id="page-title" class="text-xl font-black text-slate-900 tracking-tight">Agenda de Horários</h2>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <p class="text-xs font-bold text-slate-900">Salão Principal</p>
                    <p class="text-[11px] text-emerald-600 font-medium">● Sistema Conectado ao Firebase</p>
                </div>
                <div class="w-10 h-10 bg-indigo-100 text-indigo-700 rounded-xl font-bold flex items-center justify-center">
                    NR
                </div>
            </div>
        </header>

        <div class="p-8 max-w-7xl w-full mx-auto space-y-6">
            <!-- ABA 1: AGENDA -->
            <div id="tab-agenda" class="tab-content space-y-6">
                <div class="flex justify-between items-center">
                    <p class="text-sm text-slate-500">Gerencie os compromissos e horários do estabelecimento.</p>
                </div>
                <div class="bg-white border border-slate-100 rounded-3xl p-6 shadow-sm">
                    <p class="text-slate-600 text-sm">Nenhum agendamento pendente para hoje.</p>
                </div>
            </div>

            <!-- ABA 2: CLIENTES -->
            <div id="tab-clientes" class="tab-content hidden space-y-6">
                <p class="text-sm text-slate-500">Lista de clientes cadastrados.</p>
            </div>

            <!-- ABA 3: PRODUTOS -->
            <div id="tab-produtos" class="tab-content hidden space-y-6">
                <p class="text-sm text-slate-500">Controle de estoque e produtos.</p>
            </div>

            <!-- ABA 4: RELATÓRIOS -->
            <div id="tab-relatorios" class="tab-content hidden space-y-6">
                <p class="text-sm text-slate-500">Faturamento mensal consolidado.</p>
            </div>
        </div>
    </main>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            ['agenda', 'clientes', 'produtos', 'relatorios'].forEach(name => {
                const btn = document.getElementById('btn-' + name);
                btn.className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition";
            });

            const activeBtn = document.getElementById('btn-' + tabName);
            activeBtn.className = "w-full flex items-center space-x-3 px-4 py-3 rounded-xl bg-indigo-600 text-white font-semibold transition shadow-md shadow-indigo-600/20";

            const titles = {
                'agenda': 'Agenda de Horários',
                'clientes': 'Gestão de Clientes',
                'produtos': 'Controle de Produtos e Estoque',
                'relatorios': 'Relatórios Mensais e Faturamento'
            };
            document.getElementById('page-title').innerText = titles[tabName];
        }
    </script>
</body>
</html>
