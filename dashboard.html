<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda - NRAgenda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased flex h-screen overflow-hidden">

    <!-- Menu Lateral (Drawer Roxo) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 flex flex-col justify-between">
        <div>
            <div class="bg-purple-900 text-white p-6 space-y-3">
                <div class="flex justify-center">
                    <div class="w-16 h-16 rounded-full border-2 border-purple-300 flex items-center justify-center bg-purple-800 text-lg font-bold">
                        NR
                    </div>
                </div>
                <div class="text-center">
                    <h3 class="font-bold text-base">Espaço de Beleza</h3>
                    <p class="text-xs text-purple-200">Leo</p>
                    <p class="text-[11px] text-purple-300 truncate">leobroken@hotmail.com</p>
                    <p class="text-[11px] text-purple-300">+55 (12) 98120-5942</p>
                </div>
                <div class="bg-purple-800/60 rounded-lg p-2 text-center text-xs flex items-center justify-center space-x-1 text-purple-200">
                    <i class="fa-solid fa-gem text-purple-300"></i>
                    <span>Assinante</span>
                </div>
            </div>

            <nav class="p-2 space-y-1 text-sm font-medium overflow-y-auto max-h-[calc(100vh-250px)]">
                <button onclick="switchTab('vendas')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-purple-50 hover:text-purple-900 transition"><i class="fa-solid fa-cash-register w-5 text-purple-800"></i><span>Vendas</span></button>
                <button onclick="switchTab('agenda')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg bg-purple-100 text-purple-900 font-semibold transition"><i class="fa-solid fa-calendar-days w-5 text-purple-800"></i><span>Agenda</span></button>
                <button onclick="switchTab('clientes')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-purple-50 hover:text-purple-900 transition"><i class="fa-solid fa-users w-5 text-purple-800"></i><span>Clientes</span></button>
                <button onclick="switchTab('relatorios')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-purple-50 hover:text-purple-900 transition"><i class="fa-solid fa-chart-pie w-5 text-purple-800"></i><span>Relatórios</span></button>
                <button onclick="switchTab('produtos')" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-slate-600 hover:bg-purple-50 hover:text-purple-900 transition"><i class="fa-solid fa-box-archive w-5 text-purple-800"></i><span>Produtos</span></button>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-100">
            <a href="index.html" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-red-600 hover:bg-red-50 transition text-sm font-medium"><i class="fa-solid fa-power-off w-5"></i><span>Sair</span></a>
        </div>
    </aside>

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity"></div>

    <!-- Área Principal -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <header class="bg-purple-800 text-white shadow-md z-10">
            <div class="px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <button onclick="toggleSidebar()" class="text-white text-lg focus:outline-none p-1"><i class="fa-solid fa-bars"></i></button>
                    <h1 class="text-lg font-bold tracking-wide">Agenda</h1>
                </div>
                <div class="flex items-center space-x-4 text-xs font-medium">
                    <button class="hover:text-purple-200">Compartilhar</button>
                    <button class="hover:text-purple-200">Lista</button>
                    <button class="hover:text-purple-200">Ajuda</button>
                </div>
            </div>

            <!-- Seletor de Data -->
            <div class="bg-purple-900 px-4 py-2.5 flex items-center justify-between">
                <button onclick="mudarDia(-1)" class="text-purple-300 hover:text-white px-2"><i class="fa-solid fa-chevron-left"></i></button>
                <div onclick="toggleCalendarModal()" class="bg-white text-purple-900 px-6 py-1.5 rounded-full text-xs font-bold shadow-sm flex items-center space-x-2 cursor-pointer hover:bg-purple-50 transition">
                    <i class="fa-regular fa-calendar text-purple-700"></i>
                    <span id="data-atual-label">23/09/2026, quarta-feira</span>
                </div>
                <button onclick="mudarDia(1)" class="text-purple-300 hover:text-white px-2"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </header>

        <!-- Conteúdo da Agenda -->
        <div class="flex-1 overflow-y-auto bg-white relative">
            <div class="sticky top-0 bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between z-10 shadow-sm">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-purple-100 border border-purple-300 text-purple-900 font-bold flex items-center justify-center text-xs">L</div>
                    <span class="font-bold text-slate-800 text-sm">Leo</span>
                </div>
            </div>

            <!-- Grelha de Horários -->
            <div id="grelha-horarios" class="divide-y divide-slate-100 text-xs"></div>
        </div>

        <!-- Botão Flutuante (+) -->
        <button onclick="alert('Criar novo agendamento')" class="fixed bottom-6 right-6 w-14 h-14 bg-teal-500 hover:bg-teal-600 text-white rounded-full shadow-2xl flex items-center justify-center text-2xl transition z-30 focus:outline-none">
            <i class="fa-solid fa-plus"></i>
        </button>
    </main>

    <!-- MODAL DO CALENDÁRIO INTERATIVO (Sem marcações, totalmente clicável) -->
    <div id="calendarModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl animate-in fade-in zoom-in duration-200">
            <div class="bg-purple-900 text-white px-6 py-4 flex items-center justify-between">
                <button onclick="toggleCalendarModal()" class="text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
                <div class="flex items-center space-x-2 text-sm font-semibold">
                    <span>setembro de 2026</span>
                    <i class="fa-solid fa-chevron-down text-xs"></i>
                </div>
                <div class="flex space-x-3 text-purple-300">
                    <button><i class="fa-solid fa-chevron-left"></i></button>
                    <button><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div class="p-6 space-y-4">
                <div class="grid grid-cols-7 text-center text-xs font-bold text-slate-400">
                    <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
                </div>
                
                <!-- Grelha de Dias do Mês (Todos clicáveis de 1 a 30) -->
                <div class="grid grid-cols-7 gap-y-3 text-center text-xs font-semibold text-slate-700">
                    <span class="text-slate-300 py-2">30</span>
                    <span class="text-slate-300 py-2">31</span>
                    <button onclick="selecionarData(1)" class="py-2 hover:bg-purple-100 rounded-full transition">1</button>
                    <button onclick="selecionarData(2)" class="py-2 hover:bg-purple-100 rounded-full transition">2</button>
                    <button onclick="selecionarData(3)" class="py-2 hover:bg-purple-100 rounded-full transition">3</button>
                    <button onclick="selecionarData(4)" class="py-2 hover:bg-purple-100 rounded-full transition">4</button>
                    <button onclick="selecionarData(5)" class="py-2 hover:bg-purple-100 rounded-full transition">5</button>
                    
                    <button onclick="selecionarData(6)" class="py-2 hover:bg-purple-100 rounded-full transition">6</button>
                    <button onclick="selecionarData(7)" class="py-2 hover:bg-purple-100 rounded-full transition">7</button>
                    <button onclick="selecionarData(8)" class="py-2 hover:bg-purple-100 rounded-full transition">8</button>
                    <button onclick="selecionarData(9)" class="py-2 hover:bg-purple-100 rounded-full transition">9</button>
                    <button onclick="selecionarData(10)" class="py-2 hover:bg-purple-100 rounded-full transition">10</button>
                    <button onclick="selecionarData(11)" class="py-2 hover:bg-purple-100 rounded-full transition">11</button>
                    <button onclick="selecionarData(12)" class="py-2 hover:bg-purple-100 rounded-full transition">12</button>
                    
                    <button onclick="selecionarData(13)" class="py-2 hover:bg-purple-100 rounded-full transition">13</button>
                    <button onclick="selecionarData(14)" class="py-2 hover:bg-purple-100 rounded-full transition">14</button>
                    <button onclick="selecionarData(15)" class="py-2 hover:bg-purple-100 rounded-full transition">15</button>
                    <button onclick="selecionarData(16)" class="py-2 hover:bg-purple-100 rounded-full transition">16</button>
                    <button onclick="selecionarData(17)" class="py-2 hover:bg-purple-100 rounded-full transition">17</button>
                    <button onclick="selecionarData(18)" class="py-2 hover:bg-purple-100 rounded-full transition">18</button>
                    <button onclick="selecionarData(19)" class="py-2 hover:bg-purple-100 rounded-full transition">19</button>
                    
                    <button onclick="selecionarData(20)" class="py-2 hover:bg-purple-100 rounded-full transition">20</button>
                    <button onclick="selecionarData(21)" class="py-2 hover:bg-purple-100 rounded-full transition">21</button>
                    <button onclick="selecionarData(22)" class="py-2 hover:bg-purple-100 rounded-full transition">22</button>
                    <button onclick="selecionarData(23)" class="py-2 bg-teal-500 text-white rounded-full font-bold transition">23</button>
                    <button onclick="selecionarData(24)" class="py-2 hover:bg-purple-100 rounded-full transition">24</button>
                    <button onclick="selecionarData(25)" class="py-2 hover:bg-purple-100 rounded-full transition">25</button>
                    <button onclick="selecionarData(26)" class="py-2 hover:bg-purple-100 rounded-full transition">26</button>
                    
                    <button onclick="selecionarData(27)" class="py-2 hover:bg-purple-100 rounded-full transition">27</button>
                    <button onclick="selecionarData(28)" class="py-2 hover:bg-purple-100 rounded-full transition">28</button>
                    <button onclick="selecionarData(29)" class="py-2 hover:bg-purple-100 rounded-full transition">29</button>
                    <button onclick="selecionarData(30)" class="py-2 hover:bg-purple-100 rounded-full transition">30</button>
                    <span class="text-slate-300 py-2">1</span>
                    <span class="text-slate-300 py-2">2</span>
                    <span class="text-slate-300 py-2">3</span>
                </div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <button onclick="toggleCalendarModal()" class="text-red-500 font-bold text-xs">Limpar</button>
                    <button onclick="toggleCalendarModal()" class="bg-teal-500 text-white px-6 py-2 rounded-full font-bold text-xs shadow-md">Ok</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Gestão -->
    <script>
        let diaAtualSelecionado = 23;
        const horarios = ["08:00", "09:00", "10:00", "11:00", "14:00", "15:00", "16:00", "20:00", "20:30", "21:00", "21:30", "22:00", "22:30", "23:00", "23:30"];
        
        // Simulação de compromissos dinâmicos por dia
        const baseAgendamentos = {
            "23": [{ hora: "21:00", cliente: "Camila Souza", servico: "Aplicação de Mega Hair" }],
            "15": [{ hora: "14:00", cliente: "Mariana Costa", servico: "Manutenção e Hidratação" }],
            "10": [{ hora: "10:00", cliente: "Juliana Lima", servico: "Colocação de Fios" }]
        };

        function renderizarAgenda(dia) {
            const container = document.getElementById('grelha-horarios');
            container.innerHTML = "";

            horarios.forEach(h => {
                const agendamento = (baseAgendamentos[dia] || []).find(a => a.hora === h);
                const linha = document.createElement('div');
                linha.className = "flex items-center px-6 py-4 hover:bg-slate-50";
                
                if(agendamento) {
                    linha.innerHTML = `
                        <span class="w-16 font-mono text-purple-700 font-bold">${h}</span>
                        <div class="flex-1 border-l border-purple-200 pl-4 bg-purple-50/50 p-2 rounded-lg flex justify-between items-center">
                            <div>
                                <p class="font-bold text-slate-900">${agendamento.cliente}</p>
                                <p class="text-[11px] text-purple-600">${agendamento.servico}</p>
                            </div>
                            <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded-full">Confirmado</span>
                        </div>
                    `;
                } else {
                    linha.innerHTML = `
                        <span class="w-16 font-mono text-slate-400 font-semibold">${h}</span>
                        <div class="flex-1 border-l border-slate-200 pl-4 text-slate-300">Nenhum agendamento</div>
                    `;
                }
                container.appendChild(linha);
            });
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
            document.getElementById('overlay').classList.toggle('hidden');
        }

        function toggleCalendarModal() {
            document.getElementById('calendarModal').classList.toggle('hidden');
        }

        function selecionarData(dia) {
            diaAtualSelecionado = dia;
            const diasDaSemana = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
            // Exemplo fixo base setembro 2026
            const dataObj = new Date(2026, 8, dia);
            const nomeDiaSemana = diasDaSemana[dataObj.getDay()];
            
            const diaFormatado = String(dia).padStart(2, '0');
            document.getElementById('data-atual-label').innerText = `${diaFormatado}/09/2026, ${nomeDiaSemana}`;
            
            renderizarAgenda(dia);
            toggleCalendarModal();
        }

        function mudarDia(delta) {
            let novoDia = diaAtualSelecionado + delta;
            if(novoDia >= 1 && novoDia <= 30) {
                selecionarData(novoDia);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderizarAgenda(23);
        });

        function switchTab(tabName) {
            if(tabName === 'agenda') {
                toggleSidebar();
                return;
            }
            alert('Acessando aba: ' + tabName);
        }
    </script>
</body>
</html>
